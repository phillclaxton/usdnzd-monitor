---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read the app version
        id: manifest
        run: |
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('fx_strategy/config.yaml'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Map architecture to a platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            armv7) echo "platform=linux/arm/v7" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: fx_strategy
          file: fx_strategy/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: false
          load: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.manifest.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
