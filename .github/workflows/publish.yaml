---
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: App version to publish (must match config.yaml)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest version matches the tag
        id: manifest
        run: |
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('fx_strategy/config.yaml'))['version'])")
          expected="${{ github.event.inputs.version || github.event.release.tag_name }}"
          expected="${expected#v}"
          if [ "${version}" != "${expected}" ]; then
            echo "config.yaml says ${version} but the release is ${expected}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map architecture to a platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            armv7) echo "platform=linux/arm/v7" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fx_strategy
          file: fx_strategy/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-fx-strategy:${{ steps.manifest.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-fx-strategy:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.manifest.outputs.version }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}
