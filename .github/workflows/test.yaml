---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND: fx_strategy/rootfs/app/backend
  FRONTEND: fx_strategy/rootfs/app/frontend

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: ${{ env.BACKEND }}
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint
        working-directory: ${{ env.BACKEND }}
        run: .venv/bin/ruff check .

      - name: Format check
        working-directory: ${{ env.BACKEND }}
        run: .venv/bin/ruff format --check .

      - name: Type check
        working-directory: ${{ env.BACKEND }}
        run: .venv/bin/mypy app

      - name: Tests with coverage
        working-directory: ${{ env.BACKEND }}
        run: |
          .venv/bin/python -m pytest \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85

      - name: Financial calculation coverage
        working-directory: ${{ env.BACKEND }}
        # The calculation modules carry a higher bar than the codebase overall.
        run: |
          .venv/bin/python -m pytest app/tests \
            --cov=app.services.calculations \
            --cov=app.services.obligation_engine \
            --cov=app.money \
            --cov-report=term-missing --cov-fail-under=95

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ${{ env.BACKEND }}/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND }}
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: ${{ env.FRONTEND }}
        run: npm run typecheck

      - name: Unit tests
        working-directory: ${{ env.FRONTEND }}
        run: npm test

      - name: Build
        working-directory: ${{ env.FRONTEND }}
        run: npm run build

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND }}/package-lock.json

      - name: Build the frontend
        working-directory: ${{ env.FRONTEND }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the backend
        working-directory: ${{ env.BACKEND }}
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install Playwright browsers
        working-directory: ${{ env.FRONTEND }}
        # FX_CHROMIUM_PATH can point at a pre-installed Chromium instead; see
        # docs/development.md.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: ${{ env.FRONTEND }}
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ${{ env.FRONTEND }}/playwright-report
          if-no-files-found: ignore

  image:
    name: App image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Exactly the arguments the Supervisor passes, so a Dockerfile that only
      # builds by hand cannot pass here. Nothing built this image before, which
      # is how a BUILD_FROM declared after the first FROM — and therefore out of
      # scope for the FROM that used it — reached a release.
      - name: Build as the Supervisor does
        uses: docker/build-push-action@v6
        with:
          context: fx_strategy
          file: fx_strategy/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
            BUILD_ARCH=amd64
            BUILD_VERSION=0.0.0-ci

      # Without build.yaml the Supervisor passes no BUILD_FROM at all, so the
      # Dockerfile's own default has to resolve to a real image on its own.
      - name: Build with the Dockerfile's own default base
        uses: docker/build-push-action@v6
        with:
          context: fx_strategy
          file: fx_strategy/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=0.0.0-ci

  manifest:
    name: App manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the add-on repository and manifest
        uses: home-assistant/actions/hassfest@master
        continue-on-error: true
      - name: Validate YAML syntax
        run: |
          python3 - <<'PY'
          import sys
          import yaml
          for path in ("repository.yaml", "fx_strategy/config.yaml",
                       "fx_strategy/build.yaml", "fx_strategy/translations/en.yaml"):
              with open(path) as handle:
                  yaml.safe_load(handle)
              print(f"ok {path}")
          PY
