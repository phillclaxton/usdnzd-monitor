[project]
name = "fx-strategy-backend"
version = "1.3.0"
description = "FX Strategy Manager backend for Home Assistant"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "aiomqtt>=2.3",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is fine in this codebase's tests
    "B008",   # FastAPI Depends() in defaults
    "RUF012", # mutable class attrs without ClassVar annotations
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "alembic/*"]
# SQLAlchemy's asyncio layer runs application code inside greenlets. Without
# this, request handlers that touch the database are reported as unexecuted.
concurrency = ["thread", "greenlet"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["alembic/", "app/tests/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "aiomqtt.*"]
ignore_missing_imports = true
